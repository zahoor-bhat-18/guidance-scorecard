# One-off check of why the PDF and OCR tools do not install on the runner. Safe to delete.
name: apt-diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          command -v pdftotext tesseract || true
          cat /etc/apt/apt-mirrors.txt || true
          getent hosts azure.archive.ubuntu.com security.ubuntu.com archive.ubuntu.com || echo "DNS: no answer"
          sudo timeout 100 apt-get update 2>&1 | tail -15 || true
          sudo timeout 200 apt-get install -y -o Acquire::Retries=1 -o Acquire::http::Timeout=15 poppler-utils tesseract-ocr 2>&1 | tail -25 || true
          command -v pdftotext tesseract || echo "still missing"
