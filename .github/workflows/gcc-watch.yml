name: gcc-watch

# GCC Watch's send, run here for the same reasons as Release Watch: this
# repository holds the keys and the subscriber list, and its minutes are free.
# The code is in the private Gcc-watch- repository, read with RW_READ_TOKEN
# (a fine-grained, read-only token that must include that repository).
#
#   schedule          every two hours: each Saudi code someone follows, its
#                     newest results announcement, sent once
#   gcc-sample        fired by the Worker when someone confirms: the latest
#                     results email for one code, to that one address
#   workflow_dispatch by hand: a test to TEST_EMAIL, or a run for given codes
#
# The run log is public. The send script prints counts, never addresses.

on:
  # The website starts the check every two hours (gcc-check); GitHub's own schedule, which it often skips, is a backup.
  schedule:
    - cron: "17 */2 * * *"
  repository_dispatch:
    types: [gcc-sample, gcc-check]
  workflow_dispatch:
    inputs:
      symbols:
        description: "Codes, comma-separated: 2222, DFM:EMAAR, MSX:BKMB (blank = every code followed)"
        required: false
        default: ""
      test:
        description: "Test: send to TEST_EMAIL only. Records nothing."
        type: boolean
        default: true
      ref:
        description: "Branch of the GCC Watch code to run (main for the live emails)"
        required: false
        default: "main"
      dry:
        description: "Dry run: build the emails into an artifact, send nothing."
        type: boolean
        default: false
      resend:
        description: "Resend to followers of the named codes, whatever the age. Text = subject prefix (e.g. Corrected); '-' for none; blank = off."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: gcc-watch-${{ github.event.client_payload.email || 'run' }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zahoor-bhat-18/Gcc-watch-
          ref: ${{ inputs.ref || 'main' }}
          path: gcc
          token: ${{ secrets.RW_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Dubai and Oman statements are PDFs, some of them scanned: pdftotext and OCR.
      # The PDF and OCR tools are kept in the Actions cache once downloaded, so a run does not depend on Ubuntu's
      # package servers being up: they were down on 11 Nov 2026 and no Dubai, Oman or Bahrain filing could be read.
      - uses: actions/cache/restore@v4
        id: debs
        with:
          path: ~/gcc-debs
          key: gcc-debs-ubuntu-24.04-v1
      - name: PDF and OCR tools
        id: tools
        timeout-minutes: 10
        continue-on-error: true
        run: |
          have() { command -v pdftotext >/dev/null && command -v tesseract >/dev/null; }
          mkdir -p ~/gcc-debs
          if ! have && ls ~/gcc-debs/*.deb >/dev/null 2>&1; then sudo dpkg -i ~/gcc-debs/*.deb >/dev/null 2>&1 || true; fi
          for i in 1 2; do
            have && break
            sudo timeout 60 apt-get update -q >/dev/null 2>&1 || true
            sudo timeout 180 apt-get install -y -q -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Keep-Downloaded-Packages=true -o Dir::Cache::archives="$HOME/gcc-debs" poppler-utils tesseract-ocr >/dev/null 2>&1 || true
            sudo chown -R "$USER" ~/gcc-debs; rm -rf ~/gcc-debs/partial ~/gcc-debs/lock
          done
          if have; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::PDF or OCR tools missing: Dubai, Oman and Bahrain filings cannot be read this run"; fi
          ls ~/gcc-debs/*.deb >/dev/null 2>&1 && echo "debs=true" >> "$GITHUB_OUTPUT" || true
      - uses: actions/cache/save@v4
        if: ${{ steps.debs.outputs.cache-hit != 'true' && steps.tools.outputs.ok == 'true' && steps.tools.outputs.debs == 'true' }}
        with:
          path: ~/gcc-debs
          key: gcc-debs-ubuntu-24.04-v1
      - name: Build and send
        working-directory: gcc
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          SITE_URL: "https://zahoorbhat.com"
          REPLY_TO: ${{ vars.REPLY_TO }}
          POSTAL_ADDRESS: ${{ vars.POSTAL_ADDRESS }}
          TEST_EMAIL: ${{ vars.TEST_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SAMPLE_TO: ${{ github.event.client_payload.email }}
        run: |
          node scripts/send.mjs ${{ inputs.dry && '--dry' || (inputs.test && '--test' || (inputs.resend && format('--resend={0}', inputs.resend) || '')) }} "${{ github.event.client_payload.symbols || inputs.symbols }}"
      - uses: actions/upload-artifact@v4
        # Dry and test runs only: a resend goes to real subscribers, and its copies would carry their unsubscribe
        # links. This repo is public, so its artifacts can be downloaded by anyone.
        if: ${{ inputs.dry || inputs.test }}
        with:
          name: gcc-dry
          path: gcc/out/
          retention-days: 3
