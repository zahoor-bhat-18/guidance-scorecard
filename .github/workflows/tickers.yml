name: tickers

# Monthly, and on demand. Run it by hand once now: the poller matches nothing
# until this key exists, and it fails silently rather than loudly because an
# empty match looks exactly like a quiet day on EDGAR.

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch and store the ticker map
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: node scripts/tickers.mjs
