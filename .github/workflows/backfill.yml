name: backfill

# Manual only, and deliberately so.
#
# NO pull_request TRIGGER. This repository is public, and a workflow that runs
# on pull_request will run for anyone who opens one - with the repository's
# secrets available to it. Manual dispatch, scheduled runs and repository
# dispatch can only be started by someone with write access.
#
# The full backfill is a one-off. Once records exist, each company gains one
# release a quarter and the live path in the Worker handles it.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers. Leave blank for the whole universe. Add --rebuild to re-score, --fresh to ask the model again instead of reusing saved answers."
        required: false
        default: ""
      # Tick boxes, not typed flags. Typed "--rebuild" was mangled or cut by the
      # phone three runs in a row, and each time the run quietly merged instead.
      rebuild:
        description: "Rebuild: discard stored records and score everything again (free, uses saved answers)"
        type: boolean
        default: false
      fresh:
        description: "Ask the model again instead of reusing saved answers (costs money)"
        type: boolean
        default: false

  # A new company someone asked for on the site. Sent by the Worker when a
  # signup is confirmed (requestBackfill in src/index.js). Only a holder of
  # the repository token can send one, same as the send workflow's trigger.
  repository_dispatch:
    types: [backfill-request]

# One backfill at a time. Two running together would each save their own copy
# of the model answers, and the second to finish would drop the first's.
concurrency:
  group: backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Eleven releases per company at two model calls each. Generous, because a
    # job that dies at ninety per cent has spent the money and stored nothing.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # SAVED MODEL ANSWERS. Every answer DeepSeek has given is kept in KV
      # under one key, so a rebuild only pays for questions it has never
      # asked. See scripts/answers.mjs for why and how.
      #
      # Read over the Cloudflare API rather than wrangler, because a missing
      # key must be told apart from a real answer. A 404, a bad token or an
      # unreadable file all mean the same thing here: start empty and ask the
      # model. The run still works; it just pays. The first line of the
      # summary says how many answers were reused, which is how you notice.
      #
      # The namespace id is the one in wrangler.jsonc. It is not a secret.
      - name: Fetch saved model answers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p answers
          code=$(curl -s -o answers/download.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/ae1f3bc993714a41973b9fd4492ff641/values/answers%3Abackfill" || echo "none")
          echo "KV answered: $code"
          if [ "$code" = "200" ] && node -e 'const j = JSON.parse(require("fs").readFileSync("answers/download.json", "utf8")); if (!j || !j.answers) process.exit(1); console.log(Object.keys(j.answers).length + " saved answers downloaded.")'; then
            mv answers/download.json answers/answers.json
          else
            echo "No usable saved answers. This run will ask the model for everything."
            rm -f answers/download.json
          fi

      - name: Build the records
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # From the Worker on a request, from the box on a hand run. Passed
          # through the environment, not pasted into the command.
          REQUESTED: ${{ github.event.client_payload.tickers }}
          TYPED: ${{ inputs.tickers }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # A request with no tickers must not fall through to the whole
            # universe, which a blank box means on a hand run.
            if [ -z "$REQUESTED" ]; then echo "Request carried no tickers."; exit 1; fi
            node scripts/backfill.mjs $REQUESTED
          else
            node scripts/backfill.mjs $TYPED ${{ inputs.rebuild && '--rebuild' || '' }} ${{ inputs.fresh && '--fresh' || '' }}
          fi

      # Always, even if the build failed part-way: answers already paid for
      # are kept. The file holds every saved answer, old and new, so writing
      # it whole never loses one.
      - name: Save model answers
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -f out/answers/answers.json ]; then
            npx --yes wrangler@4 kv key put "answers:backfill" --path out/answers/answers.json --binding CACHE --remote
          else
            echo "No answers file was written. Nothing to save."
          fi

      # Straight onto the run page, so a run can be read on a phone without
      # downloading a zip and unzipping 60KB of JSON to find out it worked.
      - name: Show the summary
        if: always()
        run: cat out/summary.md >> $GITHUB_STEP_SUMMARY || echo "No summary was produced." >> $GITHUB_STEP_SUMMARY

      # Kept for 30 days, so a run can be read afterwards without going near
      # KV - and so a bad record can be compared against the one that replaced
      # it.
      - name: Keep the output
        uses: actions/upload-artifact@v4
        with:
          name: records
          path: out/
          retention-days: 30

      # One key per company, holding the whole record. It is read whole when an
      # email is built, and a lot of small writes is how the other product went
      # through the KV free tier in a day.
      - name: Write to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for file in out/*.json; do
            key="record:$(basename "$file" .json)"
            echo "Writing $key"
            npx --yes wrangler@4 kv key put "$key" --path "$file" --binding CACHE --remote
          done
          # The summary as text, served at /api/summary, so it can be read
          # whole instead of copied off a phone screen.
          if [ -f out/summary.md ]; then
            npx --yes wrangler@4 kv key put "summary:latest" --path out/summary.md --binding CACHE --remote
          fi

      # Only for a request from the site: tell everyone following each new
      # company what the backfill found. Runs even if the build failed, so a
      # company that could not be built gets a message rather than silence.
      - name: Tell who asked
        if: always() && github.event_name == 'repository_dispatch'
        env:
          REQUESTED: ${{ github.event.client_payload.tickers }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          REPLY_TO: ${{ vars.REPLY_TO }}
          POSTAL_ADDRESS: ${{ vars.POSTAL_ADDRESS }}
        run: node scripts/notify.mjs "$REQUESTED"
