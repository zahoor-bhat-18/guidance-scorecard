name: whois

# Read-only: who is on the shared subscriber list, addresses masked. Run by
# hand from Actions.

on:
  workflow_dispatch:
    inputs:
      clear:
        description: "Type CLEAR to empty the shared subscriber list (all products, all addresses). Leave blank to list."
        required: false
        default: ""
      follow:
        description: "Tickers the owner's address should follow on every product, comma-separated. Leave blank to list."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: List the shared subscribers (masked)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          TEST_EMAIL: ${{ vars.TEST_EMAIL }}
          CLEAR: ${{ inputs.clear }}
          FOLLOW: ${{ inputs.follow }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
        run: node scripts/whois.mjs
