name: sample

# Samples for a newly confirmed subscriber. Fired by the Worker when someone
# confirms at zahoorbhat.com/subscribe: the email each product would have sent
# for each company's latest filing, to that one address, marked as a sample.
# Nothing is recorded; no other subscriber is sent anything.
#
# Runnable by hand to see what a new subscriber gets.

on:
  repository_dispatch:
    types: [sample]
  workflow_dispatch:
    inputs:
      email:
        description: "Send the samples to"
        required: true
      earnings:
        description: "Release Watch tickers, comma-separated (may be blank)"
        required: false
        default: ""
      guidance:
        description: "Guidance Scorecard tickers, comma-separated (may be blank)"
        required: false
        default: ""
      filings:
        description: "Filing Watch tickers, comma-separated (may be blank)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # One run per sign-up. The address is never in a name or a setting GitHub prints: this log is public.
  group: sample-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EARNINGS: ${{ github.event.client_payload.earnings || inputs.earnings }}
      GUIDANCE: ${{ github.event.client_payload.guidance || inputs.guidance }}
      FILINGS: ${{ github.event.client_payload.filings || inputs.filings }}
      SEC_USER_AGENT: "Zahoor Bhat hello@zahoorbhat.com"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      SITE_URL: "https://zahoorbhat.com"
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      REPLY_TO: ${{ vars.REPLY_TO }}
      POSTAL_ADDRESS: ${{ vars.POSTAL_ADDRESS }}
    steps:
      # The subscriber's address (and the owner's) are read from the event and hidden from the log before any
      # step prints its settings; GitHub shows every step's settings, and this repository's logs are public.
      - name: Hide addresses
        env:
          OWNER_TO: ${{ secrets.TEST_EMAIL || vars.TEST_EMAIL }}
        run: |
          TO=$(jq -r '.client_payload.email // .inputs.email // empty' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$TO"
          [ -n "$OWNER_TO" ] && echo "::add-mask::$OWNER_TO"
          echo "SAMPLE_TO=$TO" >> "$GITHUB_ENV"
          echo "ALERT_TO=$OWNER_TO" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guidance Scorecard samples
        if: env.GUIDANCE != ''
        continue-on-error: true
        run: node scripts/send.mjs "$GUIDANCE"

      - uses: actions/checkout@v4
        if: env.EARNINGS != ''
        with:
          repository: zahoor-bhat-18/release-watch
          ref: main
          path: rw
          token: ${{ secrets.RW_READ_TOKEN }}

      - name: Release Watch samples
        if: env.EARNINGS != ''
        working-directory: rw
        run: |
          npm install --no-audit --no-fund
          node scripts/send.mjs "$EARNINGS"

      # Filing Watch: its code is read from the private filing-agent repository
      # with the same read-only key (RW_READ_TOKEN must include filing-agent).
      - uses: actions/checkout@v4
        if: env.FILINGS != ''
        with:
          repository: zahoor-bhat-18/filing-agent
          ref: main
          path: fw
          token: ${{ secrets.RW_READ_TOKEN }}

      - name: Filing Watch samples
        if: env.FILINGS != ''
        working-directory: fw
        env:
          EDGAR_UA: "Zahoor Bhat hello@zahoorbhat.com"
          EMAIL_FROM: "Filing Watch <filings@zahoorbhat.com>"
          EMAIL_REPLY_TO: ${{ vars.REPLY_TO }}
          SHARED_UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SAMPLE: "1"
        run: |
          npm install --no-audit --no-fund > /dev/null 2>&1
          # The sample is the company's latest report, 10-Q or 10-K: Starbucks' latest on 17 Nov 2026 was its
          # 10-K of 12 Nov, and the sample had compared the July 10-Q.
          curl -s -A "$EDGAR_UA" https://www.sec.gov/files/company_tickers.json -o /tmp/tickers.json || true
          for t in $(echo "$FILINGS" | tr ',' ' '); do
            CIK=$(jq -r --arg t "$t" '[.[] | select(.ticker == $t)][0].cik_str // empty' /tmp/tickers.json 2>/dev/null)
            FORM_NOW="10-Q"
            if [ -n "$CIK" ]; then
              F=$(curl -s -A "$EDGAR_UA" "https://data.sec.gov/submissions/CIK$(printf '%010d' "$CIK").json" | jq -r '[.filings.recent.form[] | select(. == "10-Q" or . == "10-K")][0] // empty' 2>/dev/null)
              [ -n "$F" ] && FORM_NOW="$F"
            fi
            echo "$t: latest report is a $FORM_NOW"
            EMAIL_TO="$SAMPLE_TO" TICKER="$t" FORM="$FORM_NOW" node scripts/section-filings.mjs > "/tmp/fw-$t.log" 2>&1 || true
            grep -E "sent to|NOT sent|ERROR|Error" "/tmp/fw-$t.log" | sed -E 's/[^ ]+@[^ ]+/<address>/g' | tail -3 || true
          done
